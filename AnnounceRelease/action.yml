name: 'Announce release'
description: 'Lock the release branch and post a Slack message pinging assignees of tickets still in the In Validation state.'
inputs:
  github-token:
    description: 'GitHub auth Token with administration:write permissions or public_repo permissions from admin account.'
    required: true
  jira-user:
    description: 'Jira auth user'
    required: true
  jira-token:
    description: 'Jira auth Token'
    required: true
  project:
    description: 'Jira project key (e.g. NET) whose tickets gate the release.'
    required: true
  slack-token:
    description: 'Slack auth Token with chat:write, chat:write.public and users:read.email scope.'
    required: true
  slack-channel:
    description: 'Slack channel name or ID to send the notification to.'
    required: true
  branch-pattern:
    description: 'Pattern of the branch protection rule to lock.'
    required: false
    default: 'master'
  additional-message:
    description: 'Additional Slack message text to be added to the default message.'
    required: false
    default: ''

runs:
  using: 'node24'
  main: '../dist/AnnounceRelease/Index.js'
