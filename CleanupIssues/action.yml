name: 'Cleanup issues'
description: 'Cleanup stale Jira issues created by automation for PRs that were closed or merged on GitHub, but not in Jira.'
inputs:
  github-token:
    description: 'GitHub auth Token'
    required: true
  jira-user:
    description: 'Jira auth User'
    required: true
  jira-token:
    description: 'Jira auth Token'
    required: true
  jira-project:
    description: 'Jira project key'
    required: true

runs:
  using: 'node24'
  main: 'Index.mjs'
