name: Pull Request Created

on:
  pull_request:
    types: ["opened"]
  issue_comment:
    types: ["created"]

jobs:
  PullRequestCreated_job:
    name: Pull Request Created
    runs-on: sonar-xs
    permissions:
      id-token: write
    # For external PR, ticket should be created manually.
    # On-demand: a maintainer can comment `/PullRequestCreated` on a PR to re-run this action.
    if: |
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && github.event.comment.body == '/PullRequestCreated'
          && (github.event.comment.author_association == 'MEMBER'
              || github.event.comment.user.login == 'hashicorp-vault-sonar-prod[bot]'))
    steps:
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-jira token | GITHUB_TOKEN;
            development/kv/data/jira user | JIRA_USER;
            development/kv/data/jira token | JIRA_TOKEN;
      - uses: sonarsource/gh-action-lt-backlog/PullRequestCreated@master  # Use master to dogfood the DEV version. Use the latest @v branch in your repo.
        with:
          github-token: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          jira-user:    ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          jira-token:   ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
          jira-project: GHA
